name: Learning curriculum validation

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learning-curriculum-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate curriculum packs, build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate all national curriculum teacher packs
        run: npm run validate:national-curriculum-packs

      - name: Validate Thai B.E. 2568 competency pack
        run: npm run validate:thai-2025-packs

      - name: Validate consolidated Science teacher packs
        run: npm run validate:science-packs

      - name: Build production application
        run: npm run build

      - name: Run ESLint
        run: npm run lint
