name: Learning Branch Validation

on:
  push:
    branches:
      - paul/integrate-edna-content
  pull_request:
    branches:
      - paul/integrate-edna-content

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and production build
        run: npm run build
      - name: Repository-wide lint (existing backlog)
        continue-on-error: true
        run: npm run lint
