name: Learning Branch Validation

on:
  push:
    branches:
      - paul/integrate-edna-content
      - paul/ep-live-games-foundation
      - 'edna/**'
  pull_request:
    branches:
      - paul/integrate-edna-content
      - paul/parent-attendance-summary

concurrency:
  group: learning-branch-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Social Studies teacher-pack importer and validator
        run: node scripts/validate-social-studies-teacher-packs.mjs
      - name: Dependency security audit
        run: npm audit
      - name: Repository-wide lint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
