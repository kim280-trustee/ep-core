name: Validate Foreign Languages teacher packs

on:
  push:
    branches:
      - edna/subject-rollout
    paths:
      - "docs/learning/foreign-languages/**"
      - "scripts/validate-foreign-languages-teacher-packs.mjs"
      - "src/features/learning-content/utils/teacher-pack-parser.ts"
      - "package-lock.json"
      - ".github/workflows/validate-foreign-languages-packs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate all Foreign Languages packs
        run: node scripts/validate-foreign-languages-teacher-packs.mjs
